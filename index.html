<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image/x-icon" href="assets/icon.png">
      <link rel="stylesheet" href="style/main.css">
      <link rel="stylesheet" href="style/menu.css">
      <link rel="stylesheet" href="style/modal.css">
      <!-- Pictogrammers -->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css">
      <script src="scripts/modal.js"></script>
      <script src="scripts/backend.js"></script>
      <title>ROSETA 1.0</title>
  </head>
  <body>

      <nav>
        <div class="wrapper">
          <div class="logo"><a href="#">ROSETA</a><img src="assets/icon_white.png" alt=""> </div>
          <input type="radio" name="slider" id="menu-btn">
          <input type="radio" name="slider" id="close-btn">
          <ul class="nav-links">
            <label for="close-btn" class="btn close-btn"><i class="fas fa-times"><span class="mdi mdi-window-close"></span></i></label>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">About</a></li>
            <li>
              <a href="#" class="desktop-item">Importar</a>
              <input type="checkbox" id="showDrop">
              <label for="showDrop" class="mobile-item">Importar</label>
              <ul class="drop-menu">
                <li><a id="menu-import-csv">CSV</a></li>
                <li><a id="menu-import-json-ld">JSON-LD</a></li>
        </ul>
            </li>
            <li>
              <a href="#" class="desktop-item">Config</a>
              <input type="checkbox" id="showMega">
              <label for="showMega" class="mobile-item">Configuração</label>
              <div class="mega-box">
                <div class="content">
                  <div class="row">
                    <img src="assets/roseta.jpg" alt="">
                  </div>
                  <div class="row">
                    <header>Estrutura de registro</header>
                    <ul class="mega-links">
                      <li><a id="menu-tipo-dados">Tipo de Dados</a></li>
                    </ul>
                  </div>
                </div>
              </div>
            </li>
            <li><a href="#">Login</a></li>
          </ul>
          <label for="menu-btn" class="btn menu-btn"><i class="fas fa-bars"><span class="mdi mdi-menu"></span></i></label>
        </div>
      </nav>
        
      <div class="body-text">

        <div class="files">
          <div class="colecoes">
            <h4>Coleções</h4>
            <select id="cmb-colecoes" size="5"></select>
          </div>
  
          <div class="registros">
            <h4>Detalhes</h4>
            <div class="about">
              <div class="line">  
                <h4>Nome:</h4>
                <span id="about-nome"></span>
              </div>
              <div class="line">  
                <h4>Modal:</h4>
                <span id="about-modal"></span>
              </div>
              <div class="line">  
                <h4>Qtd. Registros:</h4>
                <span id="about-reg">0</span>
              </div>
                <h4>Campos:</h4>
                <select id="about-fields" size="5"></select>
                <div class="control">
                  <button>Novo Campo</button>
                </div>
                <button id="about-show">Ver Registros</button>
                <button id="about-save">Salvar</button>
                <button id="about-del">Deletar</button>
            </div>
          </div>
        </div>

        <div class="control">
          <button id="btn-new-colec">Nova Coleção</button>
        </div>

      </div>

      <div class="modal-area"></div>
    
  </body>
  <script src="scripts/menu.js"></script>
  <script src="scripts/main.js"></script>
  <script>
    loadUserFiles(main_data.user_id)

  </script>
</html>
