<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image/x-icon" href="assets/icon.png">
      <link rel="stylesheet" href="style/main.css">
      <link rel="stylesheet" href="style/menu.css">
      <link rel="stylesheet" href="style/window.css">
      <!-- Pictogrammers -->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css">
      <script src="scripts/window.js"></script>
      <script src="scripts/backend.js"></script>
      <title>ROSETA 1.0</title>
  </head>
  <body>

      <nav>
        <div class="wrapper">
          <div class="logo"><a href="#">ROSETA</a><img src="assets/icon_white.png" alt=""> </div>
          <input type="radio" name="slider" id="menu-btn">
          <input type="radio" name="slider" id="close-btn">
          <ul class="nav-links">
            <label for="close-btn" class="btn close-btn"><i class="fas fa-times"><span class="mdi mdi-window-close"></span></i></label>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">About</a></li>
            <li>
              <a href="#" class="desktop-item">Importar</a>
              <input type="checkbox" id="showDrop">
              <label for="showDrop" class="mobile-item">Importar</label>
              <ul class="drop-menu">
                <li><a id="menu-import-csv">CSV</a></li>
                <li><a id="menu-import-json-ld">JSON-LD</a></li>
              </ul>
            </li>
            <li>
              <a href="#" class="desktop-item">Exportar</a>
              <input type="checkbox" id="showDrop">
              <label for="showDrop" class="mobile-item">Exportar</label>
              <ul class="drop-menu">
                <li><a id="menu-export-csv">CSV</a></li>
                <li><a id="menu-export-json-ld">JSON-LD</a></li>
              </ul>
            </li>            
            <li>
              <a href="#" class="desktop-item">Config</a>
              <input type="checkbox" id="showMega">
              <label for="showMega" class="mobile-item">Config</label>
              <div class="mega-box">
                <div class="content">
                  <div class="row">
                    <img src="assets/roseta.jpg" alt="">
                  </div>
                  <div class="row">
                    <ul class="mega-links" id="menu-categorias">
                      <li><a id="menu-categoria">Categorias</a></li>
                      <li><a id="menu-padroes">Padrões</a></li>
                    </ul>
<!--                    <header>Padrões</header> 
                    <ul class="mega-links">
                      <li><a id="menu-default-schema">Schema.org</a></li>
                      <li><a id="menu-default-dublincore">Dublin Core</a></li>
                    </ul>
-->                    
                  </div>
                </div>
              </div>
            </li>
            <li><a href="#">Login</a></li>
          </ul>
          <label for="menu-btn" class="btn menu-btn"><i class="fas fa-bars"><span class="mdi mdi-menu"></span></i></label>
        </div>
      </nav>
        
      <div class="body-text">

        <div class="files">
          <div class="colecoes">
            <h4>Coleções</h4>
            <select id="cmb-colecoes" size="5"></select>
          </div>
  
          <div class="registros">
            <h4>Detalhes</h4>
            <div class="about">
              <div class="line">  
                <h4>Arquivo:</h4>
                <span id="about-file" class="about-field"></span>
                <button id="about-edit-file" class="align-right only-register" disabled>edit</button>
              </div>
              <div class="line">  
                <h4>Nome:</h4>
                <span id="about-nome" class="about-field"></span>
                <button id="about-edit-nome" class="align-right only-register" disabled>edit</button>
              </div>
              <div class="line">  
                <h4>Categoria:</h4>
                <span id="about-categoria" class="about-field"></span>
                <button id="about-edit-categoria" class="align-right only-register" disabled>edit</button>
              </div>
              <div class="line">  
                <h4>Qtd. Registros:</h4>
                <span id="about-reg" class="about-field"></span>
              </div>
              <div class="line">
                <h4>Campos:</h4>
                <button id="about-novo-campo" class="align-right only-register" disabled>Novo Campo</button>
              </div>
                <select id="about-fields" size="5"  class="about-field"></select>
                <div class="line-center">
                  <button id="about-show" class="only-register" disabled>Visualizar</button>
                  <button id="about-del" class="only-register" disabled>Deletar</button>
                  <button id="about-clone" class="only-register" disabled>Clonar</button>  
                </div>
            </div>
          </div>
        </div>

        <div class="control">
          <button id="btn-new-colec">Nova Coleção</button>
        </div>

      </div>

      <div class="window-area"></div>
    
  </body>
  <script src="scripts/menu.js"></script>
  <script src="scripts/main.js"></script>
  <script>
    loadUserFiles(main_data.user_id)


  </script>
</html>
