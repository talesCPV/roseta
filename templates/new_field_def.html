<title>Novo Campo</title>
<template>
    <style>
        .form{
            display: flex;
            flex-direction: column;
            justify-content: center;
/*            align-items: center;*/
            gap: 10px;
            height: 100%;
        }

        .line label:nth-child(1){
            min-width: 60px;
            text-align: end;
        }

        .line select, .line input, .line textarea{
            width: 100%;
            min-width: 300px;
            padding: 5px;
            font-size: 0.8em;
            resize: none;
        }


    </style>

    <div class="form">
        <div class="line">
            <label for="edtNome">Nome:</label>
            <input type="text" id="edtNome">
        </div>
        <div class="line">
            <label for="edtDefault">Valor:</label>
            <textarea id="edtDefault" rows="5"></textarea>

        </div>
        <div class="line">
            <label for="cmbKind">Tipo:</label>
            <select id="cmbKind">
                <option value="text" default="">Texto</option>
                <option value="textarea" default="">Texto Longo</option>
                <option value="number" default="0">Numérico</option>
                <option value="date" default="">Data</option>
                <option value="time" default="">Hora</option>
                <option value="datetime-local" default="">Data e Hora</option>
                <option value="url" default="">URL</option>
                <option value="color" default="">Cor</option>
                <option value="email" default="">Email</option>
                <option value="password" default="">Senha</option>
            </select>
        </div>
        <fieldset>
            <legend>Padrões</legend>
            <table id="tblPadroes"></table>
        </fieldset>
        <div class="line-center">
            <button id="btndel">Deletar</button>
            <button id="btnAdd">Salvar</button>
        </div>
    </div>

</template>
<script>

    const local_form = document.querySelector('#new_field_def')
    const local_data = main_data.new_field_def
    let field
    const newField = local_data.index < 0

    function start(){
        if(newField){
            local_form.querySelector('#btndel').disabled = 1
            field = new Object
            field.name = ''
            field.default = ''
            field.kind = 'text'
            field.parameters = new Object
        }else{
            field = local_data.fields[local_data.index]
            local_form.querySelector('#edtNome').value = field.name
            local_form.querySelector('#edtDefault').value = field.default
            local_form.querySelector('#cmbKind').value = field.kind
        }
        loadDefaults()
    }

    function loadDefaults(){
        loadFile('/../files/config/defaults.json')
        .then( text => {
            try{
                const defaults = JSON.parse(text)    
                for(let i=0; i<defaults.length; i++){                    
                    if(!field.parameters.hasOwnProperty(defaults[i].name)){
                        field.parameters[defaults[i].name] = ''
                    }
                }
                fillParameters()
            }catch{
                console.log('Arquivo de padrões não encontrado!')
            }
        })
    }

    function fillParameters(){
        const param = field.parameters
        const tbl = local_form.querySelector('#tblPadroes')
        tbl.innerHTML = ''

        for (const [key, value] of Object.entries(param)) {
            const tr = document.createElement('tr')
            tr.innerHTML = `<td>${key}</td><td>${value}</td>`
            tr.addEventListener('click',()=>{
                const new_value = prompt(`${field.name} no padrão ${key}:`,value)
                if(new_value!=null){
                    param[key] = new_value
                    tr.innerHTML = `<td>${key}</td><td>${param[key]}</td>`
                }
            })
            tbl.appendChild(tr)
        }
    }

    local_form.querySelector('#btnAdd').addEventListener('click',()=>{

        field.name = local_form.querySelector('#edtNome').value
        field.default = local_form.querySelector('#edtDefault').value
        field.kind = local_form.querySelector('#cmbKind').value
        for (const [key, value] of Object.entries(field.parameters)) {
            if(!value.length){
                delete(field.parameters[key])
            }
        }
        newField ? local_data.fields.push(field) : null
        local_data.callback(local_data.fields)
        closeWindow('new_field_def')
    })

    local_form.querySelector('#btndel').addEventListener('click',()=>{
        if(confirm('A remoção deste campo implica na perda de todos os dados referentes nos registros. Deseja continuar?')){
            local_data.fields.splice(local_data.index,1)
            local_data.callback(local_data.fields)
            closeWindow('new_field_def')
        }
    })

    start()

</script>
