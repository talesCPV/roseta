<title>Novo Campo</title>
<template>
    <style>
        .form{
            display: flex;
            flex-direction: column;
            justify-content: center;
/*            align-items: center;*/
            gap: 10px;
            height: 100%;
        }

        .line label:nth-child(1){
            min-width: 60px;
            text-align: end;
        }

        .line select, .line input, .line textarea{
            width: 100%;
            min-width: 300px;
            padding: 5px;
            font-size: 0.8em;
            resize: none;
        }

        #btn-up{
            font-size: 1.5em;
        }

    </style>

    <div class="form">
        <div class="line">
            <label for="edtNome">Nome:</label>
            <input type="text" id="edtNome">
        </div>
        <div class="line valor">
            <label for="edtDefault">Valor:</label>
            <textarea id="edtDefault" rows="5"></textarea>
        </div>
        <div class="line">
            <label for="cmbKind">Tipo:</label>
            <select id="cmbKind">
                <option value="text" default="">Texto</option>
                <option value="textarea" default="">Texto Longo</option>
                <option value="number" default="0">Numérico</option>
                <option value="date" default="">Data</option>
                <option value="time" default="">Hora</option>
                <option value="datetime-local" default="">Data e Hora</option>
                <option value="url" default="">URL</option>
                <option value="color" default="">Cor</option>
                <option value="email" default="">Email</option>
                <option value="password" default="">Senha</option>
            </select>
        </div>
        <fieldset>
            <legend>Padrões</legend>
            <table id="tblPadroes"></table>
        </fieldset>
        <div class="line-center">
            <button id="btn-up" class="btn-round"><span class="mdi mdi-arrow-up-bold"></span></button>
            <button id="btndel">Deletar</button>
            <button id="btnAdd">Salvar</button>
        </div>
    </div>

</template>
<script>
    const forms = document.querySelectorAll(`#new_field`)
    const local_form = forms[forms.length-1]
    const local_data = main_data[local_form.data_name]

    function start(){
        if(local_data.new){
            local_form.querySelector('#btndel').disabled = 1
            local_form.querySelector('#btn-up').disabled = 1
            local_data.value = new Object
        }else{
            local_form.querySelector('#edtNome').value = local_data.key
            if(local_data.value.kind=='object'){
                local_form.querySelector('.window-title').innerHTML = 'Remover Objeto'
                local_form.querySelector('#edtNome').disabled = 1
                local_form.querySelector('#btnAdd').disabled = 1
                local_form.querySelector('.valor').classList.add('hide')
                local_form.querySelector('#cmbKind').disabled = 1
                local_form.querySelector('fieldset').classList.add('hide')
                local_form.querySelector('#cmbKind').innerHTML = '<option value="object">Objeto</option>'
            }else{
                local_form.querySelector('#edtDefault').value = local_data.value.default
                local_form.querySelector('#cmbKind').value = local_data.value.kind
                local_form.querySelector('.window-title').innerHTML = 'Editar Campo'
            }
        }
        loadDefaults()
    }

    function loadDefaults(){
        loadFile('/../files/config/defaults.json')
        .then( text => {
            try{
                const parameters = JSON.parse(text)
                local_data.value.parameters = local_data.new ? {} : local_data.value.parameters
                for (const [key, value] of Object.entries(parameters)) {   
                    if(!local_data.value.parameters.hasOwnProperty(key)){
                        local_data.value.parameters[key] = ''                            
                    }
                }
            }catch{
                local_data.value.parameters = new Object
            }
            fillParameters()
        })
    }

    function backcall(nw=1,dl=0){
        const out = new Object
        out.field = new Object
        out.field.name = local_form.querySelector('#edtNome').value
        out.field.default = local_form.querySelector('#edtDefault').value
        out.field.kind = local_form.querySelector('#cmbKind').value

        for (const [key, value] of Object.entries(field.parameters)) {
            if(!value.length){
                delete(field.parameters[key])
            }
        }
    }

    function fillParameters(){
        const param = local_data.value.parameters
        const tbl = local_form.querySelector('#tblPadroes')
        tbl.innerHTML = ''
        for (const [key, value] of Object.entries(param)) {
            const tr = document.createElement('tr')
            tr.innerHTML = `<td>${key}</td><td>${value}</td>`
            tr.addEventListener('click',()=>{
                const new_value = prompt(`${local_data.key} no padrão ${key}:`,value)
                if(new_value!=null){
                    param[key] = new_value
                    tr.innerHTML = `<td>${key}</td><td>${param[key]}</td>`
                }
            })
            tbl.appendChild(tr)
        }
    }

    local_form.querySelector('#btnAdd').addEventListener('click',()=>{
        const out = new Object
        out.name = local_form.querySelector('#edtNome').value.trim()
        out.callname = local_data.key
        out.default = local_form.querySelector('#edtDefault').value.trim()
        out.kind = local_form.querySelector('#cmbKind').value
        out.parameters = local_data.value.parameters
        out.new = local_data.new
        out.del = 0
        out.up = 0
        for (const [key, value] of Object.entries(out.parameters)) {
            value.length ? null : delete(out.parameters[key])
        }
        local_data.callback(out)
        closeWindow('new_field')
    })

    local_form.querySelector('#btndel').addEventListener('click',()=>{
        if(confirm('A remoção deste campo implica na perda de todos os dados referentes nos registros. Deseja continuar?')){
            const out = new Object
            out.del = 1
            out.callname = local_data.key
            local_data.callback(out)
            closeWindow('new_field')
        }
    })

    local_form.querySelector('#btn-up').addEventListener('click',()=>{
        const out = new Object
        out.up = 1
        out.callname = local_data.key
        local_data.callback(out)
        closeWindow('new_field')
    })

    start()

</script>
