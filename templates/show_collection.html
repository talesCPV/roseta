<title id="page-title"></title>
<template>
    <style>
        .hide{
            display: none;
        }

        img{
            width: 100%;
        }

        label{
            cursor: pointer;
        }

        /* Chrome, Safari, Edge, Opera */
            input::-webkit-outer-spin-button,
            input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Firefox */
            input[type=number] {
            -moz-appearance: textfield;
        }

        #edt-goto{
            width: 55px;
            text-align: center;
        }

        .range{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            align-items: center;
            border-bottom: solid;
            padding-bottom: 15px;
        }

        .left{
            width:30% ;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .rigth{
            width: 67%;
            max-height: 75vh;
            overflow: scroll;
            padding-bottom: 30px;
        }

        .register{
            container-type: inline-size;
            display: flex;
            gap: 20px;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            padding-top: 20px;
        }

        .line{
            display: flex;
            flex-direction: column;
            padding: 5px;
            border-bottom: solid 1px;
            align-items: baseline;
        }

        .line input{
            width: 100%;
            padding: 2px;
        }

        .btn-round{
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            cursor: pointer;
        }

        .slide-control{
            display: flex;
            justify-content: space-evenly;
        }

        .slideshow {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            height: 400px;
            width: 100%;
        }

        .slideshow img {
            position: absolute;
            width: 100%;
/*            height: 100%;*/
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease-in-out; /* Suaviza a troca */
        }

        /* Apenas a imagem ativa fica visível */
        .slideshow img.active {
            opacity: 1;
        }

        @media screen and (max-width: 785px) {
            .left{
                width: 100%;
                height: 100%;
            }
            .rigth{width: 100%;}
/*
            .slideshow, .slideshow img{
                position: unset;
                height: unset;
            }
*/
        }


    </style>



    <div id="main">
        <div class="range">
    
            <label for="edt-goto">Registros</label>
            <div class="btn-round" id="btn-left"><span class="mdi mdi-arrow-left-bold-circle"></span></div>
            <input type="number" id="edt-goto">
            <div class="btn-round" id="btn-right"><span class="mdi mdi-arrow-right-bold-circle"></span></div>
            <div class="btn-round" id="btn-add"><span class="mdi mdi-plus-circle"></span></div>
        </div>

        <div class="register">
            <div class="left"></div>
            <div class="rigth"></div>
        </div>
    </div>


</template>
<script>

//    const localScreen = document.querySelector('#impost_csv')
    const local_form = document.querySelector('#show_collection')
    const collection = main_data.show_collection
    let roseta = []

    function start(){
        document.querySelector('.categoria-title').innerHTML = collection.name
        if(collection.registers.length){
            document.querySelector('#edt-goto').value = 0
            loadRegister(0)
        }
    }

    function getURL(obj){

        const out = new Object
        out.img = []
        out.url = []
        for (const [key, value] of Object.entries(reg)) {
            let isImg = 0
            if(value.includes('http')){
                vl = value.split('http')
                vl = 'http'+vl[vl.length-1]

                let i=vl.length-1
                let ext = ''
                while(i>0 && vl[i]!='/'){
                    if(vl[i]=='.' && ext.length){
                        isImg = ['png','jpg','jpeg','gif','bmp','svg'].includes(ext)
                        i=0
                    }else{
                        ext = vl[i] + ext
                    }
                    i--
                }
                isImg ? /*out.img.includes(vl)?null:*/out.img.push(vl) : out.url.push(vl)
                obj[key] = vl
            }
        }
        return out
    }

    function editRegister(index,field,value){
        collection.editRegister(index,field,value)
        saveColecao(findColecao(collection.file))
    }

    function loadRegister(index){
        function slide(side=1){
            const imgs =  show.querySelectorAll('img')
            for(let i=0; i<imgs.length; i++){
                if(imgs[i].classList.contains('active')){
                    index = side ?(i==imgs.length-1 ? 0 : i+1) : (i==0 ? imgs.length-1 : i-1)
                    imgs[i].classList.remove('active')
                    imgs[index].classList.add('active')
                    i=imgs.length
                }
            }
        }

        reg = collection.registers[index]
        const url = getURL(reg)
        
        const left_panel = document.querySelector('.left')
        left_panel.innerHTML = ''
        const show = document.createElement('div')
        show.className = 'slideshow'
        left_panel.appendChild(show)

        const control = document.createElement('div')
        control.className = 'slide-control'

        const lft = document.createElement('div')
        lft.className = 'btn-round'
        lft.innerHTML = '<span class="mdi mdi-arrow-left-bold-circle">'
        lft.addEventListener('click',()=>{slide(0)})
        control.appendChild(lft)

        const rgt = document.createElement('div')
        rgt.className = 'btn-round'
        rgt.innerHTML = '<span class="mdi mdi-arrow-right-bold-circle">'
        rgt.addEventListener('click',()=>{slide(1)})
        control.appendChild(rgt)
        left_panel.appendChild(control)

        for(let i=0; i<url.img.length; i++){
            const img = document.createElement('img')
            img.src = url.img[i]
            i==0 ? img.classList.add('active') : null
            show.appendChild(img)
        }
        
        try{
            img = reg['Categorias,URL de Origem'].split(':')
            document.querySelector('#reg-img').src = img.length>2 ? img[1]+':'+img[2] : ''
        }catch{null}

        const panel = document.querySelector('.rigth')
        panel.innerHTML = ''
        const record = []
        for (const [key, value] of Object.entries(reg)) {            
            const line = document.createElement('div')
            line.className = 'line'
            panel.appendChild(line)

            line.data = new Object
            line.data.field = new Object
            line.data.field.data = key.split(',')
            line.data.field.data.length <2 ? line.data.field.data.unshift('text') : null
            line.data.field.type = line.data.field.data[0] 
            line.data.field.title = line.data.field.data[1]

            const label = document.createElement('label')
            label.innerHTML = line.data.field.title
            line.appendChild(label)

            const valor = document.createElement('input')
            valor.value = value
            valor.readOnly = true
            line.data.value = value
            line.data.edit = valor
            line.appendChild(valor)
            line.addEventListener('click',()=>{
                line.data.callback = editRegister
                line.data.index = index
                openHTML('edit_field',line.data,[500,150])
            })
            record.push({"field":line.data.field.title,"value":value})
        }
    }

    function fragmenta(line,sep){
        line = line.replaceAll(', ', '*|**|*')
        const arr = line.split(sep)
        for(let i=0; i<arr.length; i++){
            arr[i] = arr[i].replaceAll('*|**|*', ', ')
        }
        return arr
    }

    function makeJSON(txt){
        const lines = txt.split('\n')        
        const head = lines[0].split('|')
        function newJSON(){
            const out = new Object
            for(let i=0; i<head.length; i++){
                out[head[i]] = ''
            }
            return out
        }

    registers = []
        for(let i=1; i<lines.length; i++){
            const obj = newJSON()
            const line = fragmenta(lines[i],',')
            for(let i=0; i<line.length; i++){
                obj[head[i]] = line[i]
            }
            registers.push(obj)
        }
        try{
            loadRegister(0)
        }catch{null}
    }

    local_form.querySelector('#edt-goto').addEventListener('change',(e)=>{
        const index = (local_form.querySelector('#edt-goto').value>collection.registers.length-1) ? collection.registers.length-1 : document.querySelector('#edt-goto').value
        local_form.querySelector('#edt-goto').value = index
        loadRegister(index)
    })

    local_form.querySelector('#btn-left').addEventListener('click',()=>{
        try{
            local_form.querySelector('#edt-goto').value--
            const index = local_form.querySelector('#edt-goto').value
            loadRegister(index)
        }catch{
            local_form.querySelector('#edt-goto').value++
        }
    })

    local_form.querySelector('#btn-right').addEventListener('click',()=>{
        local_form.querySelector('#edt-goto').value++
        try{
            const index = Number(local_form.querySelector('#edt-goto').value)
            loadRegister(index)
        }catch{local_form.querySelector('#edt-goto').value--}
    })

    local_form.querySelector('#btn-add').addEventListener('click',()=>{

        const reg = new Object
        for(let i=0; i<collection.fields.length; i++){
            reg[collection.fields[i].name] = collection.fields[i].default
        }
        collection.registers.push(reg)
        loadRegister(collection.registers.length-1)
        const index = findColecao(collection)
        if(index>=0){
            editColecao(index,'registers',main_data.colecoes[index].registers)
        }
    })

    start()

</script>
