<title>Edição de Dados</title>
<template>
    <style>

        .line{
            border-bottom: unset !important;
        }

        .input-place{
            width: 100%;
        }

        .valor{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80%;
            gap: 15px;
        }

        textarea{
            width: 100%;
            height: 300px;
            resize: none;
        }   
    </style>

    <div class="line">
        <label for="edtValue" id="lblField"></label>
        <div class="input-place"></div>
        <div class="line-center">
            <button id="btnSave">Salvar</button>
        </div>
    </div>



</template>
<script>
    const local_data = main_data.edit_field
    const local_form = document.querySelector('#edit_field')
    
    function start(){
        function newElement(type){
        
            let el
            if(type=='textarea'){
                el = document.createElement('textarea')
            }else{
                el = document.createElement('input')
                el.type = ['number','date','time','datetime-local','url','color','email','password'].includes(type) ? type : 'text'
            }
            el.value = local_data.value
            el.id="edtValue"
            return el
        }

        console.log(local_data)

        const el = newElement(local_data.field.kind)
        local_form.querySelector('.input-place').appendChild(el)        
        local_form.querySelector('.window-title').innerHTML = local_data.field.name
        local_form.querySelector('#lblField').innerHTML = local_data.field.name
        local_form.querySelector('#edtValue').value = local_data.value
        el.focus()
        el.select()
    }

    local_form.querySelector('#btnSave').addEventListener('click',()=>{
        local_data.callback(local_form.querySelector('#edtValue').value)
        closeWindow('edit_field')
    })


    

    start()

</script>
